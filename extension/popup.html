<!DOCTYPE html> 
<html lang="en">
    <head>    
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Permix</title>
        <link rel="stylesheet" href="popup.css">
    </head>
    <body>
        <div class="container">
            <header class="header">
                <div class="brand">
                    <img src="logo.png" alt="Permix Logo" class="logo-img">
                    <div>
                        <h1>Permix</h1>
                        <p class="domain-text" id="currentDomain">Detecting Site...</p>
                    </div>
                </div>
            </header>
            <section class="card" id="cleanupCard">
                <h2 class="section-title">Data Cleanup</h2>
                <div class="action-grid">
                    <button class="btn btn-secondary" id="btnClearCache">Clear Cache</button>
                    <button class="btn btn-secondary" id="btnClearCookies">Clear Cookies</button>
                </div>
                <button class="btn btn-danger" id="btnClearAll">Purge Site Data</button>
            </section>
            <div class="toast" id="toast">Action Completed</div>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
